name: pr

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-vendor/setup-tool@main
      - name: greet
        run: echo "Thanks for ${{ github.event.pull_request.title }}"
